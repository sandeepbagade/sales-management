<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f5" />
    <title>Monarch Technologies — Sales workspace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" aria-label="Monarch Technologies home" data-page="Overview">
          <img src="monarch-logo.jpg" alt="Monarch Technologies" />
        </a>

        <div class="workspace-picker">
          <span class="workspace-avatar">M</span>
          <span class="workspace-name"><strong>Monarch Technologies</strong><small>Sales workspace</small></span>
          <span class="chevron">⌄</span>
        </div>

        <p class="nav-label">WORKSPACE</p>
        <nav class="primary-nav" aria-label="Main navigation">
          <button class="nav-item active" data-page="Overview"><span class="nav-icon">⌂</span>Overview</button>
          <button class="nav-item" data-page="Today"><span class="nav-icon">◷</span>Today<span class="nav-count" id="today-count">0</span></button>
          <button class="nav-item" data-page="Leads"><span class="nav-icon">↗</span>Leads<span class="nav-count" id="leads-count">0</span></button>
          <button class="nav-item" data-page="Customers"><span class="nav-icon">♧</span>Customers</button>
          <button class="nav-item" data-page="Products"><span class="nav-icon">▦</span>Products</button>
          <button class="nav-item" data-page="Deals"><span class="nav-icon">▱</span>Deals</button>
          <button class="nav-item" data-page="Tasks"><span class="nav-icon">☷</span>Tasks</button>
          <button class="nav-item" data-page="Reports"><span class="nav-icon">▥</span>Reports</button>
        </nav>

        <div class="sidebar-bottom">
          <button class="profile-button" type="button">
            <span class="profile-avatar">TM</span>
            <span class="profile-name"><strong>Team member</strong><small>Monarch Technologies</small></span>
            <span class="chevron">···</span>
          </button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Open navigation">☰</button>
          <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-slash">/</span><strong id="page-name">Overview</strong></div>
          <div class="topbar-actions">
            <label class="search-box">
              <span aria-hidden="true">⌕</span>
              <input id="global-search" type="search" placeholder="Search anything..." autocomplete="off" aria-label="Search current view" />
              <kbd>⌘ K</kbd>
            </label>
            <button class="icon-button notification-button" type="button" aria-label="Notifications">♧<i></i></button>
            <button class="button button-primary top-add" type="button" id="top-add"><span>＋</span> Add new</button>
          </div>
        </header>

        <div class="page-container">
          <section class="page-view active" id="overview-view" data-view="Overview"></section>
          <section class="page-view" id="today-view" data-view="Today"></section>
          <section class="page-view" id="leads-view" data-view="Leads"></section>
          <section class="page-view" id="customers-view" data-view="Customers"></section>
          <section class="page-view" id="products-view" data-view="Products"></section>
          <section class="page-view" id="deals-view" data-view="Deals"></section>
          <section class="page-view" id="tasks-view" data-view="Tasks"></section>
          <section class="page-view" id="reports-view" data-view="Reports"></section>
          <footer class="page-footer"><span>© <span id="current-year">2026</span> Monarch Technologies</span><span>Made for teams that care about the follow-up.</span></footer>
        </div>
      </main>
    </div>

    <div class="modal-backdrop" id="lead-modal" aria-hidden="true">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <div><p class="eyebrow">QUICK CAPTURE</p><h2 id="modal-title">Add a new lead</h2></div>
          <button class="icon-button modal-close" type="button" aria-label="Close dialog">×</button>
        </div>
        <p class="modal-intro">Capture the essentials now. You can fill in the rest later.</p>
        <form id="lead-form">
          <label class="form-field">Full name <span>*</span><input name="name" required placeholder="Contact name" /></label>
          <div class="form-row">
            <label class="form-field">Phone number <span>*</span><input name="phone" type="tel" required placeholder="+91 98765 43210" /></label>
            <label class="form-field">Email address<input name="email" type="email" placeholder="name@company.com" /></label>
          </div>
          <div class="form-row">
            <label class="form-field">Company<input name="company" placeholder="Company name" /></label>
            <label class="form-field">Lead source<select name="source"><option>Website</option><option>Referral</option><option>WhatsApp</option><option>IndiaMART</option><option>Walk-in</option><option>Event</option><option>Other</option></select></label>
          </div>
          <label class="form-field">What are they looking for?<textarea name="requirement" rows="3" placeholder="Add a short note about their requirement..."></textarea></label>
          <div class="modal-actions"><button type="button" class="button button-quiet modal-close">Cancel</button><button type="submit" class="button button-primary">Save lead <span>→</span></button></div>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="entity-modal" aria-hidden="true">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="entity-modal-title">
        <div class="modal-header">
          <div><p class="eyebrow" id="entity-modal-eyebrow">QUICK CAPTURE</p><h2 id="entity-modal-title"></h2></div>
          <button class="icon-button entity-modal-close" type="button" aria-label="Close dialog">×</button>
        </div>
        <p class="modal-intro" id="entity-modal-intro"></p>
        <form id="entity-form">
          <div id="entity-fields"></div>
          <div class="modal-actions"><button type="button" class="button button-quiet entity-modal-close">Cancel</button><button type="submit" class="button button-primary" id="entity-submit"></button></div>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
